<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list</title>

    <!----- Google Font ----->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!----- Custom Style ----->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <section class="todo-section">
        <div class="container">
            <h1 class="todo-title">Todo list</h1>
            <form class="todo-form">
                <input class="todo-input" type="text" placeholder="Add a new task...">
                <button class="btn icon-btn flex-1 todo-add-btn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="todo-add-icon lucide lucide-plus-icon lucide-plus">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    <span class="todo-add-text">Add</span>
                </button>
            </form>
            <ul class="todo-list">
            </ul>
            <button class="btn mx-auto clear-all-btn">Clear All Tasks</button>
        </div>
    </section>

    <!----- Custom Js ----->
    <script src="assets/js/script.js"></script>
</body>

</html>
